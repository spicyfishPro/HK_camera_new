name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Windows tests
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: windows

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q core ui tests scripts

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Check capture UI at 125 and 150 percent scaling
        shell: pwsh
        run: |
          foreach ($scale in @("1.25", "1.5")) {
            $env:QT_SCALE_FACTOR = $scale
            python -m unittest discover -s tests -p test_capture_ui.py -v
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Render capture UI for visual review
        shell: pwsh
        run: |
          foreach ($scale in @("1", "1.25", "1.5")) {
            $env:QT_SCALE_FACTOR = $scale
            python scripts/render_capture_ui.py --output ui-validation
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Upload UI validation screenshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: capture-ui-preview
          path: ui-validation/*.png
          if-no-files-found: error
          retention-days: 14
